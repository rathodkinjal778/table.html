<html>
<head>
    <title>if...else if...else</title>
</head>
<body>
    <script>
	    var num=5;
		if(num>0)
		{
		  document.write("Number is positive");
		}
		else if(num<0)
		{
		 document.write("Number is nagative");
		}
		else
		{
		 document.write("Number is zero");
		}
	
	</script>
</body>
</html>
