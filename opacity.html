<html>
<head>
    <title>Css opacity example</title>
	
	<style>
	    .box1{
		    background-color:pink;
			opacity:1;
	    }
		.box2{
		    background-color:lightblue;
			opacity:0.5;
		}
		.box3{
		    background-color:lightyellow;
			opacity:0.2;
		}
	</style>

</head>
<body>
    <div class="box1">
	    opacity 1
    </div>
	
	<div class="box2">
	    opacity 0.5
	</div>
	
	<div class="box3">
	    opacity 0.1
	</div>
</body>
</html>
