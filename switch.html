<html>
<head>
    <title>switch</title>
</head>
<body>
    <script>
	    var a=10;
		var b=5;
		var choice=1;
		switch(choice)
	        {
		    case 1:
			    document.write("Addition:",a+b);
			case 2:
			    document.write("subtraction:",a-b);
			default:
			    document.write("invalid choice");
		    }
	</script>
</body>
</html>
